services:
  postgres:
    image: postgres:16
    container_name: cpplinq-postgres-test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cppdb
      POSTGRES_PASSWORD: cppdb_password
      POSTGRES_DB: cppdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cppdb -d cppdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cpplinq-mssql-test
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Developer"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
