name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        build_type: [ Release ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev unixodbc-dev

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCPPLINQ_BUILD_TESTS=ON
        -DCPPLINQ_BUILD_EXAMPLES=ON
        -DCPPLINQ_ENABLE_SQLITE=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

    - name: Run Example
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          ./build/examples/${{ matrix.build_type }}/basic_usage.exe
        else
          ./build/examples/basic_usage
        fi
